<!doctype html>
<html lang="es-CO">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carta de IA responsable · Territoria</title>
<style>body{font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:860px;margin:auto;padding:20px;color:#14171f;background:#fff}h1{color:#0f9d76}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:#fff4d6;color:#7a5200;font-size:13px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #d8dbe2;padding:6px;text-align:left;vertical-align:top}
.muted{color:#5b6170;font-size:14px}a{color:#0f7a5e}</style></head>
<body><main id="carta"></main>
<script src="carta_ia.js"></script>
<script>(function(){const K=window.CARTA_IA,H=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N={contenido:"Contenido",propuestas:"Propuestas",documentos:"Documentos",chat:"Chat",chatbot:"Chatbot ciudadano",asesor:"Asesor de campaña",clasificador_e14:"Clasificador de imagen E-14"};
document.getElementById("carta").innerHTML=`<span class="chip">${H(K.estado)}</span><h1>${H(K.titulo)}</h1><p class="muted">${H(K.version)}</p><p>${H(K.intro)}</p>`+
K.principios.map((p,i)=>`<h2>${i+1}. ${H(p[0])}</h2><p>${H(p[1])}</p>`).join("")+
`<h2>Inventario de funciones de IA</h2><table><tr><th>Función</th><th>Para qué</th><th>Datos que usa</th><th>Riesgo</th></tr>${K.inventario.map(f=>`<tr><td><b>${H(N[f[0]]||f[0])}</b></td><td>${H(f[1])}</td><td>${H(f[2])}</td><td>${H(f[3])}</td></tr>`).join("")}</table>`+
`<h2>Normas de referencia</h2><ul>${K.normas.map(n=>`<li>${H(n)}</li>`).join("")}</ul><p class="muted">${H(K.pie)}</p><p><a href="index.html#/mis-datos">Mis datos</a> · <a href="index.html">Volver a la app</a></p>`})();</script>
</body></html>
