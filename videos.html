<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Territoria · Videos instructivos</title><link rel="icon" href="icon.svg">
<style>:root{--bg:#0f1424;--card:#171e33;--tx:#e8ecf7;--mu:#9aa6c4;--pri:#6c7cff;--ac:#ffb300}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:12px;align-items:center;padding:14px 18px;background:#121a30;border-bottom:1px solid #26304d;flex-wrap:wrap}header h1{margin:0;font-size:1.25rem}header a{color:#cfd7ff;font-size:.9rem}.chip{font-size:.72rem;border:1px solid #6b5a1e;color:#ffd36b;padding:2px 8px;border-radius:999px}
.wrap{max-width:1250px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.player{background:var(--card);border-radius:14px;padding:12px;align-self:start;position:sticky;top:10px}@media(max-width:860px){.player{position:static}}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px}.player h2{margin:10px 0 4px;font-size:1.1rem}.player p{margin:0;color:var(--mu);font-size:.92rem}.nav{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btn{background:#222b47;color:var(--tx);border:1px solid #33406a;border-radius:9px;padding:7px 12px;font-size:.88rem;cursor:pointer;text-decoration:none}.btn.pri{background:var(--pri);border-color:var(--pri)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}li button{all:unset;cursor:pointer;display:grid;grid-template-columns:110px 1fr;gap:10px;background:var(--card);border-radius:12px;padding:8px;width:100%;box-sizing:border-box;border:2px solid transparent}li button:hover,li button:focus-visible{border-color:#3a4880}li button[aria-current=true]{border-color:var(--ac)}li img{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#000}li b{font-size:.92rem;display:block}li small{color:var(--mu);font-size:.78rem}.dur{color:var(--ac);font-weight:600}footer{color:var(--mu);font-size:.8rem;text-align:center;padding:18px}</style></head>
<body><header><h1>🎬 Territoria · Videos instructivos</h1><span class="chip">Datos ficticios de ejemplo</span><span style="flex:1"></span><a href="./">← Volver a la aplicación</a></header>

pan class="dur">1:52</span></small></span></button></li><li><button type="button" data-i="7"><img loading="lazy" alt="" src="videos/07_asesor_ia.jpg?v=1"><span><small>Video 07</small><b>Asesor IA</b><small>Activarlo, hacer una consulta y rechazo de línea roja · <span class="dur">2:25</span></small></span></button></li><li><button type="button" data-i="8"><img loading="lazy" alt="" src="videos/08_programa.jpg?v=1"><span><small>Video 08</small><b>Programa de Gobierno</b><small>Tablero territorial, ficha, comparar, generador, alertas y exportar · <span class="dur">2:36</span></small></span></button></li><li><button type="button" data-i="9"><img loading="lazy" alt="" src="videos/09_dia_electoral.jpg?v=1"><span><small>Video 09</small><b>Día electoral y E-14</b><small>Testigo, E-14 validado y reclamaciones · <span class="dur">2:16</span></small></span></button></li><li><button type="button" data-i="10"><img loading="lazy" alt="" src="videos/10_cumplimiento.jpg?v=1"><span><small>Video 10</small><b>Cumplimiento</b><small>Bitácora, carga anómala, Mis datos, carta de IA y exportación con doble aprobación · <span class="dur">4:26</span></small></span></button></li><li><button type="button" data-i="11"><img loading="lazy" alt="" src="videos/11_alta_presentacion.jpg?v=1"><span><small>Video 11</small><b>Alta de campaña y modo presentación</b><small>Campaña nueva en 6 pasos y guion de presentación · <span class="dur">4:17</span></small></span></button></li><li><button type="button" data-i="12"><img loading="lazy" alt="" src="videos/99_completo.jpg?v=1"><span><small>Video 99</small><b>Todos los videos seguidos</b><small>Los 12 videos en uno solo · <span class="dur">30:23</span></small></span></button></li></ol></nav></div>
<footer>Videos grabados sobre la demo v0.8 con la campaña ficticia de Laura Camargo Niño. Ninguna cifra de votos es oficial.</footer>
<script>const L=[{"k":"00_introduccion","t":"Introducción y selector de rol","d":"Entrar, declarar y cambiar de rol (candidata, gerente, líder, testigo y roles nuevos)"},{"k":"01_tablero","t":"Tablero de la candidata","d":"Embudo de votos y «conteo interno, no oficial»"},{"k":"02_estrategia","t":"Estrategia","d":"Meta de abajo hacia arriba, planificador inverso, Brújula, cuarto de guerra y matriz de mensajes"},{"k":"03_red","t":"Red de líderes","d":"Árbol, enlace y QR, referidos pendientes y grafo"},{"k":"04_simpatizantes","t":"Simpatizantes e importación desde Excel","d":"Fichas, derechos del titular e importación con vista previa"},{"k":"05_mapa_divipole","t":"Mapa y Divipole","d":"123 municipios y municipio asignado según la dirección"},{"k":"06_centro_redes","t":"Centro de redes","d":"Compositor con IA, vista previa por red y aprobación"},{"k":"07_asesor_ia","t":"Asesor IA","d":"Activarlo, hacer una consulta y rechazo de línea roja"},{"k":"08_programa","t":"Programa de Gobierno","d":"Tablero territorial, ficha, comparar, generador, alertas y exportar"},{"k":"09_dia_electoral","t":"Día electoral y E-14","d":"Testigo, E-14 validado y reclamaciones"},{"k":"10_cumplimiento","t":"Cumplimiento","d":"Bitácora, carga anómala, Mis datos, carta de IA y exportación con doble aprobación"},{"k":"11_alta_presentacion","t":"Alta de campaña y modo presentación","d":"Campaña nueva en 6 pasos y guion de presentación"},{"k":"99_completo","t":"Todos los videos seguidos","d":"Los 12 videos en uno solo"}];const v=document.getElementById('vid');let i=0;
function ir(n,play){i=(n+L.length)%L.length;const x=L[i];v.src='videos/'+x.k+'.mp4?v=1';v.poster='videos/'+x.k+'.jpg?v=1';document.getElementById('vt').textContent='Video '+x.k.slice(0,2)+' · '+x.t;document.getElementById('vd').textContent=x.d;document.getElementById('dl').href=v.src;
 document.querySelectorAll('#lista button').forEach(b=>b.setAttribute('aria-current',b.dataset.i==i));history.replaceState(null,'','#'+x.k);if(play)v.play().catch(()=>{})}
document.getElementById('lista').onclick=e=>{const b=e.target.closest('button');if(b){ir(+b.dataset.i,true);if(innerWidth<860)scrollTo({top:0,behavior:'smooth'})}};
document.getElementById('ant').onclick=()=>ir(i-1,true);document.getElementById('sig').onclick=()=>ir(i+1,true);
const h=L.findIndex(x=>'#'+x.k==location.hash);ir(h<0?0:h,false);</script></body></html>
